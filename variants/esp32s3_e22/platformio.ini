build_flags =
  ${ESP32S3_E22.build_flags}
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D MAX_CONTACTS=100
  -D LORA_TX_POWER=22
lib_deps =
